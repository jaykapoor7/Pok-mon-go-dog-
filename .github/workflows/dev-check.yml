name: Quality gate

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

# Pushing a branch again supersedes the run already in flight for it. Without
# this they both run to completion, and a stale run failing on code nobody is
# looking at any more still sends a failure email. Keyed by ref so main and dev
# never cancel each other.
concurrency:
  group: quality-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # next/font/google fetches every family from Google at build time, and a
      # failed fetch fails the whole build: that is what broke this gate on
      # 32b1f32 (DM_Sans) and the production deploy of 93c2ce3. Next caches
      # downloaded fonts under .next/cache, so restoring it means a rerun does
      # not depend on that request succeeding again. It does not help a cold
      # cache; self-hosting the faces is the real cure if this keeps recurring.
      - name: Restore Next build cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**/*.[jt]s', 'src/**/*.[jt]sx') }}
          restore-keys: |
            next-${{ hashFiles('package-lock.json') }}-
            next-
      - run: npm run typecheck
      - run: npm run build
      - name: Import and case regression tests
        run: |
          npm run test:master-import
          npm run test:master-import:pagination
          npm run test:master-import:locality
          npm run test:master-import:staging
          npm run test:master-import:resume
          npm run test:case-input-validation
          npm run test:sql-rpc-mapping
          npm run test:spatial
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Browser regression suite
        run: npm run test:e2e
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=critical
