name: Quality gate

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Import and case regression tests
        run: |
          npm run test:master-import
          npm run test:master-import:pagination
          npm run test:master-import:locality
          npm run test:master-import:staging
          npm run test:master-import:resume
          npm run test:case-input-validation
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Browser regression suite
        run: npm run test:e2e
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=critical
