name: AnimalID worker

# Runs the AnimalID worker on a schedule: it processes every queued photo
# search and profile-indexing job, then exits. No always-on server is needed
# for a pilot; searches are answered within about ten minutes.
#
# Needs two repository secrets (Settings → Secrets and variables → Actions):
#   ANIMALID_SUPABASE_URL           the Supabase project URL
#   ANIMALID_SUPABASE_SERVICE_KEY   that project's service role key
# Until both are set, the job reports "not configured" and stops. The key
# stays on GitHub's runner; logs carry job ids, status and timings only.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: animalid-worker
  cancel-in-progress: false

jobs:
  drain:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_URL: ${{ secrets.ANIMALID_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.ANIMALID_SUPABASE_SERVICE_KEY }}
      HF_HOME: ${{ github.workspace }}/.hf
    steps:
      - name: Check configuration
        id: cfg
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "AnimalID worker not configured: add ANIMALID_SUPABASE_URL and ANIMALID_SUPABASE_SERVICE_KEY." >> "$GITHUB_STEP_SUMMARY"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.cfg.outputs.ready == 'true'
      - name: Anything queued?
        if: steps.cfg.outputs.ready == 'true'
        id: queue
        run: |
          n=$(curl -s -o /dev/null -D - "$SUPABASE_URL/rest/v1/animalid_jobs?status=eq.queued&select=id" -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" -H "Prefer: count=exact" -H "Range: 0-0" | tr -d '\r' | awk -F/ 'tolower($0) ~ /^content-range/ {print $2}')
          n=${n:-unknown}
          echo "Queued jobs: $n" >> "$GITHUB_STEP_SUMMARY"
          if [ "$n" = "0" ]; then echo "work=false" >> "$GITHUB_OUTPUT"; else echo "work=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-python@v5
        if: steps.cfg.outputs.ready == 'true' && steps.queue.outputs.work == 'true'
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/animalid/requirements.txt
      - name: Model cache
        if: steps.cfg.outputs.ready == 'true' && steps.queue.outputs.work == 'true'
        uses: actions/cache@v4
        with:
          path: .hf
          key: animalid-hf-dinov2-base-v1
      - name: Install
        if: steps.cfg.outputs.ready == 'true' && steps.queue.outputs.work == 'true'
        working-directory: services/animalid
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install -r requirements.txt
      - name: Process the queue
        if: steps.cfg.outputs.ready == 'true' && steps.queue.outputs.work == 'true'
        working-directory: services/animalid
        run: python -m animalid.worker --drain
