name: Apply Supabase migration

on:
  workflow_dispatch:
    inputs:
      migration_set:
        description: "Migration set to apply"
        required: true
        default: pilot
        type: choice
        options:
          - pilot
          - rollout
          - personal
          - wards
          - security-audit

permissions:
  contents: read

# Database DDL must never run concurrently. A second click waits for the first
# run rather than competing for locks or applying the same schema change mid-run.
concurrency:
  group: straypaw-supabase-migrations
  cancel-in-progress: false

jobs:
  migrate:
    name: Apply ${{ inputs.migration_set }} migration
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply migration or read-only security audit
        env:
          # Supabase direct connections resolve IPv6-first. GitHub-hosted
          # runners are IPv4-only, so this must be the Session Pooler URI
          # (Connect → Session pooler → URI), stored as this repository secret.
          SUPABASE_POOLER_URL: ${{ secrets.SUPABASE_POOLER_URL }}
        run: |
          if [ "${{ inputs.migration_set }}" = "security-audit" ]; then
            npm run db:security:audit
          else
            npm run db:migrate -- "${{ inputs.migration_set }}"
          fi
