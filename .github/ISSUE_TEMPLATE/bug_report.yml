name: Bug report
description: Report a reproducible product defect (do not include private data)
title: "fix: "
body:
  - type: markdown
    attributes:
      value: "Do not include credentials, personal records, private case media, security findings or live account access details. For vulnerabilities, follow SECURITY.md."
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the observed behaviour and affected workflow.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Use synthetic data only.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: Browser, device and deployment type (no credentials)
